[package]
name = "ele_bot_server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ElectronBotCli 后端服务(持有所有硬件资源, 通过 WebSocket 与客户端通信)"

[features]
default = []
fps-counter = []

[[bin]]
name = "ele_bot_server"
path = "src/main.rs"

[dependencies]
ele_bot_proto = { path = "../ele_bot_proto" }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
simplelog = { workspace = true }
toml = { workspace = true }
async-stream = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
hf-hub = { workspace = true }

# 硬件与 AI
electron-bot = { workspace = true }
BotEyes = { workspace = true }
cpal = { workspace = true }
candle-core = { workspace = true }
candle-transformers = { workspace = true }
tokenizers = { workspace = true }
async-openai = { workspace = true }

# Web/WebSocket 服务
axum = { workspace = true }
tokio-stream = { workspace = true }

# 平台特定
[target.'cfg(windows)'.dependencies]
nokhwa = { workspace = true, features = ["input-native"] }
[target.'cfg(unix)'.dependencies]
nokhwa = { workspace = true, features = ["input-v4l"] }
[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { workspace = true, features = ["input-avfoundation"] }

# RKNN only for aarch64 linux
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
rknn-rs = { workspace = true }
librga = { workspace = true }
# aarch64 链接官方 RKNN 版预编译 shared 库 (provider="rknn" 走 NPU);
# 库目录由交叉镜像 ENV SHERPA_ONNX_LIB_DIR 注入, sys crate 自动拷 .so + 加 $ORIGIN rpath
sherpa-onnx = { workspace = true, default-features = false, features = ["shared"] }

# PC 平台
[target.'cfg(not(all(target_os = "linux", target_arch = "aarch64")))'.dependencies]
ort = { workspace = true }
# PC 保持 static 链接, 行为不变
sherpa-onnx = { workspace = true, features = ["static"] }
