[workspace]
resolver = "2"
members = [
    "crates/ele_bot_proto",
    "crates/ele_bot_server",
    "crates/ele_bot_client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# 共享
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
anyhow = "1.0"
log = "0.4"
thiserror = "2"
async-trait = "0.1.91"
futures = "0.3"
bytes = "1.12"
toml = "1.0.1"

# 服务端专用
electron-bot = { git = "https://github.com/TOTHTOT/ElectronBotLib.git", version = "0.1.0" }
BotEyes = { git = "https://github.com/TOTHTOT/BotEyes", version = "0.1.2" }
sherpa-onnx = "1.12.39"
cpal = "0.17.1"
candle-core = "0.9"
candle-transformers = "0.9"
tokenizers = "0.22.2"
async-openai = { version = "0.34.0", features = ["_api", "chat-completion", "chat-completion-types"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tokio-stream = "0.1"
async-stream = "0.3"
base64 = "0.22"
hf-hub = "0.5.0"
image = "0.25.9"
chrono = "0.4"
simplelog = "0.12"
nokhwa = { version = "0.10.10", default-features = false }

# aarch64 linux 专用
rknn-rs = "0.2.4"
librga = { git = "https://github.com/TOTHTOT/librga-rs.git", version = "0.1.0"}

# pc 平台专用
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-24", "tls-native"] }

# 客户端专用
ratatui = "0.30.0"
crossterm = "0.29.0"
tokio-tungstenite = { version = "0.24", features = ["connect", "tokio-native-tls"] }

[profile.release]
opt-level = 3
panic = "abort"
lto = "thin"
codegen-units = 16
