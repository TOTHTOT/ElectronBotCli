[workspace]
resolver = "2"
members = [
    "crates/ele_bot_proto",
    "crates/ele_bot_server",
    "crates/ele_bot_client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# 共享
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"] }
anyhow = "1.0"
log = "0.4"
thiserror = "2"
async-trait = "0.1.91"
futures = "0.3"
bytes = "1.12"
toml = "1.0.1"

# 服务端专用
electron-bot = { git = "https://github.com/TOTHTOT/ElectronBotLib.git", version = "0.1.0" }
BotEyes = { git = "https://github.com/TOTHTOT/BotEyes", version = "0.1.2" }
cpal = "0.18.1"
# 音频的asr推理框架 (default-features 关掉, 各平台显式选 static/shared;
# 预编译库 assets/lib/sherpa-onnx-rknn 不进 git, 由 scripts/tools/fetch_sherpa_rknn.sh
# 下载; 升级版本时同步改脚本默认版本并重跑)
sherpa-onnx = { version = "1.13.4", default-features = false }
# 离线llm推理框架
candle-core = "0.11"
candle-transformers = "0.11"
tokenizers = "0.23.1"
# 在线llm运行框架
async-openai = { version = "0.41.2", features = ["_api", "chat-completion", "chat-completion-types"] }
# hugging face 模型下载与管理
hf-hub = { version = "1.0.0", default-features = false, features = ["blocking", "rustls-tls"] }
sysinfo = "0.38"
axum = { version = "0.8", features = ["ws", "macros"] }
tokio-stream = "0.1"
async-stream = "0.3"
base64 = "0.23"
image = "0.25.9"
chrono = "0.4"
simplelog = "0.12"
nokhwa = { version = "0.10.10", default-features = false }

# aarch64 linux 专用
rknn-rs = "0.2.4"
librga = { git = "https://github.com/TOTHTOT/librga-rs.git", version = "0.3.0"}

# pc 平台专用
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-24", "tls-native"] }

# 客户端专用
ratatui = "0.30.0"
crossterm = "0.29.0"
tokio-tungstenite = { version = "0.30", features = ["connect", "tokio-native-tls"] }
unicode-width = "0.2"

[profile.release]
opt-level = 3
panic = "abort"
lto = "thin"
codegen-units = 16
