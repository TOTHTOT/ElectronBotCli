[target.x86_64-pc-windows-msvc]
rustflags = ["-L", "native=./assets/module/vosk/vosk_win64_lib"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3", "-L", "native=./assets/module/vosk/vosk_linux64_lib"]

[target.aarch64-unknown-linux-gnu]
rustflags = [
    "-C", "target-cpu=cortex-a55",
    "-C", "target-feature=+neon,+dotprod,+fp16", # 显式开启半精度和点积加速
    "-L", "native=./assets/module/vosk/vosk_linux_arcch64_lib"
]
linker = "aarch64-linux-gnu-gcc"

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-gnu-gcc"

[env]
PKG_CONFIG_ALLOW_CROSS = "1"
PKG_CONFIG_PATH_aarch64_unknown_linux_gnu = "/usr/lib/aarch64-linux-gnu/pkgconfig/"